workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.aistudio.videoreward.kptvyz"
      java: 17
    scripts:
      - name: Update Gradle Wrapper and Build APK
        script: |
          cd app
          # যদি প্রজেক্টে gradle wrapper না থাকে তবে তা তৈরি করে নেবে এবং সংস্করণ ঠিক করে দেবে
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          cd ..
          ./app/gradlew assembleDebug || gradle assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
